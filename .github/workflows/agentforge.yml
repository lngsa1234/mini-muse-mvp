# LynnCraft: verifies every pull request. Added by the lynncraft:setup skill.
#
#   verify — on each pull request: compares the branch with its base and runs every test
#            linked to an acceptance criterion or a journey. It fails, and with the
#            required check turned on blocks the merge, when a criterion the branch breaks
#            isn't updated in its spec, or a linked test fails or can't be found. Other
#            findings are listed in one comment that updates itself. No model, no secret,
#            no cost. Nothing runs after a merge: the docs and tests change in the pull
#            request, together with the code.
#
# The check runs from .agentforge/bin/, a copy of the plugin's scripts the setup
# skill commits alongside this file (run the skill again to update it).
name: LynnCraft

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  # LynnCraft's checks, copied into this repository.
  AGENTFORGE: .agentforge/bin/agentforge.mjs

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the project
        run: bash "$(dirname "$AGENTFORGE")/ci-install.sh"
      - name: Verify specs, code and tests
        id: verify
        run: |
          set +e
          node "$AGENTFORGE" verify --ci --base "origin/${{ github.base_ref }}" > "$RUNNER_TEMP/lynncraft-report.md"
          status=$?
          set -e
          echo "_Run \`/lynncraft:verify\` (or ask \"verify this branch\") to work through it._" >> "$RUNNER_TEMP/lynncraft-report.md"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Comment on the pull request
        # Pull requests from forks get a read-only token; the report stays in the run summary.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/lynncraft-report.md" --edit-last --create-if-none
      - name: Pass or fail
        run: exit "${{ steps.verify.outputs.status }}"
